name: Verify private browser proxy

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: vpn-verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          # Gitleaks scans reachable Git history, not only the PR working tree.
          fetch-depth: 0

      - name: Install pinned Gitleaks CLI
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks_8.30.1_linux_x64.tar.gz"
          curl --fail --location --silent --show-error --retry 3 \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' \
            "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb" \
            "$archive" | sha256sum --check -
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version

      - name: Scan Git history for secrets
        shell: bash
        run: |
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact=100 .

      - name: Use pinned Node.js runtime
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Frozen dependency installation (without lifecycle scripts)
        run: npm ci --ignore-scripts

      - name: Strict TypeScript verification
        run: npm run typecheck

      - name: Install test Chromium with system dependencies
        run: |
          npx playwright install --with-deps chromium
          echo "CHROMIUM_PATH=$(node --input-type=module -e 'import {chromium} from "@playwright/test"; console.log(chromium.executablePath())')" >> "$GITHUB_ENV"

      - name: Execute all unit, integration, and browser tests
        run: npm test

      - name: Build unpacked extension
        run: npm run build

      - name: Build private extension archive
        run: npm run package

      - name: Verify packaged checksum and archive integrity
        run: |
          cd dist
          sha256sum -c private-route-extension-0.1.0.zip.sha256
          unzip -t private-route-extension-0.1.0.zip

      - name: Audit locked dependencies
        run: npm audit

      - name: Check whitespace integrity
        run: git diff --check
